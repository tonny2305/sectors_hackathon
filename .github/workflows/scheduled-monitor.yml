name: Autonomous Ownership Materiality Sentinel Schedule

on:
  schedule:
    # Weekday market cycles in Jakarta time (WIB UTC+7):
    # 10:30 WIB -> 03:30 UTC
    # 12:30 WIB -> 05:30 UTC
    # 15:30 WIB -> 08:30 UTC
    # 18:30 WIB -> 11:30 UTC
    - cron: '30 3,5,8,11 * * 1-5'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Optional Start Date (YYYY-MM-DD)'
        required: false
      end_date:
        description: 'Optional End Date (YYYY-MM-DD)'
        required: false

concurrency:
  group: sectors-sentinel-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    name: Run Ownership Materiality Monitoring Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sentinel Monitor Worker
        env:
          SECTORS_API_KEY: ${{ secrets.SECTORS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          MAX_FILINGS_PAGES_PER_RUN: ${{ vars.MAX_FILINGS_PAGES_PER_RUN || '3' }}
          MAX_SECTORS_API_ATTEMPTS_PER_RUN: ${{ vars.MAX_SECTORS_API_ATTEMPTS_PER_RUN || '15' }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
            npm run monitor -- "$START_DATE" "$END_DATE"
          else
            npm run monitor
          fi
